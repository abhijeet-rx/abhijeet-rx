name: Update profile contribution heatmap

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch live GitHub contributions
        run: python scripts/fetch_contributions.py

      - name: Render contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit generated profile art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No contribution changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh contribution heatmap"
          git push
